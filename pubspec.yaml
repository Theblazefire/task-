name: diario_checklist
description: Un'app Flutter per gestire impegni con checklist colorata

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Internazionalizzazione per date in italiano
  intl: ^0.20.2
  
  # Icone Material
  cupertino_icons: ^1.0.2
  
  # Salvataggio locale dei dati
  shared_preferences: ^2.2.2
  
  # Grafici e charts
  fl_chart: ^1.1.1
  
  # Gestione file per import/export
  path_provider: ^2.1.1
  file_picker: ^10.3.10
  share_plus: ^12.0.1
  
  # Permessi storage per Android
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # Se vuoi aggiungere un'icona personalizzata, decommenta:
  # assets:
  #   - assets/images/
  
  # Esempio di font personalizzato:
  # fonts:
  #   - family: Roboto
  #     fonts:
